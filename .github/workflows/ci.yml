name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: '1'

jobs:
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      # Formatting, linting, types, spelling, and the docs' own code blocks.
      - name: Lint
        run: uv run poe lint

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      # --strict fails on a broken link or an unresolved reference.
      - name: Build
        run: uv run mkdocs build --strict

  tests:
    name: Tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      # Everything but tests/integration, which needs the containers below.
      - name: Run tests
        run: uv run pytest --ignore=tests/integration --cov=sqlakit --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.python == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration tests on SQLAlchemy ${{ matrix.sqlalchemy.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlalchemy:
          - name: locked
            install: 'true'
          # sqlmodel, a dev dependency, holds the lockfile below 2.1.
          - name: '2.1'
            install: 'uv pip install "sqlalchemy[asyncio]~=2.1.1"'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Take SQLAlchemy ${{ matrix.sqlalchemy.name }}
        run: ${{ matrix.sqlalchemy.install }}
      - name: Run integration tests
        run: uv run --no-sync pytest tests/integration

  sqlalchemy:
    name: Tests on SQLAlchemy ${{ matrix.sqlalchemy.name }}
    runs-on: ubuntu-latest
    # The lockfile tests one release of 2.0, as sqlmodel, a dev dependency,
    # holds it below 2.1. These are the rest of the range: the floor
    # `pyproject.toml` promises, the 2.1 release, and what is coming next.
    continue-on-error: ${{ matrix.sqlalchemy.upcoming || false }}
    strategy:
      fail-fast: false
      matrix:
        sqlalchemy:
          # Keep in step with the floor in `pyproject.toml`.
          - name: '2.0.22'
            install: 'uv pip install "sqlalchemy[asyncio]==2.0.22"'
          - name: '2.1'
            install: 'uv pip install "sqlalchemy[asyncio]~=2.1.1"'
          - name: main
            upcoming: true
            # Through pip: `uv pip` refuses SQLAlchemy's own metadata, which
            # declares one extra twice. The dependents pinned below 2.1 warn
            # here and go on working.
            install: |
              uv pip install pip
              uv run --no-sync python -m pip install --upgrade \
                "sqlalchemy @ git+https://github.com/sqlalchemy/sqlalchemy"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Take SQLAlchemy ${{ matrix.sqlalchemy.name }}
        run: ${{ matrix.sqlalchemy.install }}
      - name: Run tests
        run: uv run --no-sync pytest --ignore=tests/integration
